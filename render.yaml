services:
  - type: web
    name: devfolio-backend
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: RENDER
        value: "True"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
